# Precision Grow — ESP32 D1 Mini on the Open Grow carrier board
# Ports (RJ45, same pinout everywhere: 1=3V3 2=GND 3=A 4=B 5/6/8=GND 7=5V):
#   J1 SHT31 (I2C)          J2 scale 1 (HX711)     J3 scale 2 (HX711)
#   J4 ultrasonic AJ-SR04M  J5 I2C spare           J6 DS18B20 (irrigation tank)
#   J7 RJ12 lamp dimmer (Mars FC3000, box on EXT)  J8 dimmer 2 (spare, e.g. EC fan)
#   J9 float switch (humidifier box)
#
# Reservoir: the ultrasonic sensor reports distance in mm. The integration
# calibrates 2-point (empty/full) via the buttons — NO % conversion needed here.

substitutions:
  node_name: grow-sensor-esp32
  friendly_name: Grow Sensor

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}

esp32:
  board: wemos_d1_mini32
  framework:
    type: arduino

logger:
api:
  encryption:
    key: !secret api_encryption_key
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

# --- I2C (J1 SHT31, J5 spare); 4.7k pull-ups on the board, slow bus for long cables ---
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  frequency: 50kHz

# --- 1-Wire (J6 DS18B20); 4.7k pull-up on the board ---
one_wire:
  - platform: gpio
    pin: GPIO4

sensor:
  # Temperature + humidity (J1)
  - platform: sht3xd
    address: 0x44
    update_interval: 30s
    temperature:
      name: "${friendly_name} Temperature"
      id: grow_temp
    humidity:
      name: "${friendly_name} Humidity"
      id: grow_humidity

  # Scale 1 (J2) — HX711 next to the load cell
  - platform: hx711
    name: "${friendly_name} Weight 1"
    id: grow_weight_1
    dout_pin: GPIO16
    clk_pin: GPIO17
    gain: 128
    update_interval: 30s
    unit_of_measurement: "g"
    accuracy_decimals: 0
    filters:
      # Calibration: note the raw value empty and with a known weight.
      - calibrate_linear:
          - 0.0 -> 0.0
          - 430000.0 -> 1000.0
      - sliding_window_moving_average:
          window_size: 5
          send_every: 5

  # Scale 2 (J3)
  - platform: hx711
    name: "${friendly_name} Weight 2"
    id: grow_weight_2
    dout_pin: GPIO33
    clk_pin: GPIO32
    gain: 128
    update_interval: 30s
    unit_of_measurement: "g"
    accuracy_decimals: 0
    filters:
      - calibrate_linear:
          - 0.0 -> 0.0
          - 430000.0 -> 1000.0
      - sliding_window_moving_average:
          window_size: 5
          send_every: 5

  # Reservoir level (J4, AJ-SR04M with R7 open = trigger/echo mode, 5 V supply,
  # echo divided to 3.3 V on the board). Blind zone ~25 cm: mount the head at
  # least 25 cm above the highest water level.
  - platform: ultrasonic
    name: "${friendly_name} Reservoir distance"
    id: grow_reservoir
    trigger_pin: GPIO26
    echo_pin: GPIO27
    pulse_time: 20us
    timeout: 4m
    update_interval: 30s
    unit_of_measurement: "mm"
    accuracy_decimals: 0
    filters:
      - multiply: 1000.0   # m -> mm
      - median:
          window_size: 5
          send_every: 5

  # Irrigation water temperature (J6)
  - platform: dallas_temp
    name: "${friendly_name} Water temperature"
    id: grow_water_temp
    update_interval: 60s

binary_sensor:
  # Float switch, humidifier box (J9: switch between FLOAT and GND, 10k pull-up on the board)
  - platform: gpio
    name: "${friendly_name} Humidifier tank empty"
    id: humidifier_tank_empty
    pin:
      number: GPIO14
      mode:
        input: true
      inverted: true
    filters:
      - delayed_on_off: 2s

# --- Dimmers: PC817 pulls DIM+ to DIM- while the GPIO is high ---
# inverted: brightness = share of the period DIM+ stays high (10 V).
# The lamp's 1-10 V input never switches off: OFF in HA = minimum (~10 %).
# Switch the lamp off with its Shelly. Without the ESP the lamp runs at 100 %.
output:
  - platform: ledc
    id: dim1_pwm
    pin: GPIO25
    frequency: 1000Hz
    inverted: true
  - platform: ledc
    id: dim2_pwm
    pin: GPIO13
    frequency: 1000Hz
    inverted: true

light:
  # Mars Hydro FC3000 EVO via RJ12 (J7), controller box on EXT
  - platform: monochromatic
    name: "${friendly_name} Grow light"
    id: grow_light
    output: dim1_pwm
    gamma_correct: 1.0
    default_transition_length: 2s
    restore_mode: RESTORE_DEFAULT_ON

# Dimmer 2 (J8) stays unused until the exhaust fan is clarified (hermes-728.8):
# fan:
#   - platform: speed
#     name: "${friendly_name} Exhaust"
#     output: dim2_pwm
